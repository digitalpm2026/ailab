class Component extends DCLogic {

  pct(x) { return x.toLocaleString('es-EC', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %'; }
  play() {
    if (this._anim) cancelAnimationFrame(this._anim);
    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ t: 1 }); return; }
    const start = performance.now(), dur = 1800;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / dur);
      this.setState({ t });
      if (t < 1) this._anim = requestAnimationFrame(tick);
    };
    this.setState({ t: 0, run: (this.state && this.state.run || 0) + 1 });
    this._anim = requestAnimationFrame(tick);
  }

    const st = this.state || {};

    const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : NaN; };
    const L = num(raw.leads), I = num(raw.inter), V = num(raw.visitas), S = num(raw.ventas);
    let invalidMsg = '';
    if ([L, I, V, S].some(isNaN)) invalidMsg = 'Complete los cuatro números.';
    else if (L === 0 || I === 0 || V === 0) invalidMsg = 'Leads, interesados y visitas deben ser mayores que cero.';
    else if (I > L || V > I || S > V) invalidMsg = 'Cada etapa debe ser igual o menor que la anterior.';
    const valid = !invalidMsg;

    const stepDefs = ['1 · Sector', '2 · Números', '3 · Resultado'];
    const steps = stepDefs.map((label, i) => {
      const n = i + 1, done = n < step, cur = n === step;
      const locked = (n === 2 && !sec) || (n === 3 && (!valid || !sec || !st.revealed));
      return {
        label, current: cur ? 'step' : 'false', locked,
        text: cur ? '#FFFFFF' : (done ? '#C8C3B4' : '#6E685D'),
        bar: cur || done ? '#FF005E' : 'rgba(200,195,180,0.15)',

        go: () => { if (!locked) this.setState({ step: n }); }

    const sectorsV = sectors.map((s) => {
      const on = sec && s.id === sec.id;
      return {
        name: s.name, icon: s.icon, pressed: on ? 'true' : 'false',
        bg: on ? 'rgba(255,0,94,0.16)' : 'rgba(200,195,180,0.03)',
        border: on ? '#FF005E' : 'rgba(200,195,180,0.14)',
        glow: on ? '0 0 30px rgba(255,0,94,0.35)' : 'none',
        lift: on ? 'translateY(-3px)' : 'none',
        pick: () => {
          this.setState({ sector: s.id });
          if (this._adv) clearTimeout(this._adv);
          this._adv = setTimeout(() => { this._adv = null; this.setState({ step: 2 }); }, 380);
        }
      };
    });

    const maxes = { leads: 5000, inter: isNaN(L) ? 5000 : Math.max(1, L), visitas: isNaN(I) ? 5000 : Math.max(1, I), ventas: isNaN(V) ? 5000 : Math.max(1, V) };
    const defs = [['leads', 'Leads recibidos', 10], ['inter', 'Interesados', 1], ['visitas', 'Visitas o reuniones', 1], ['ventas', 'Ventas cerradas', 1]];
    const fields = defs.map(([key, label, stp]) => ({
      id: 'f-' + key, label, value: raw[key], max: maxes[key], step: stp,
      change: (e) => this.setState({ [key]: e.target.value })
    }));
    const fv = [L, I, V, S], fl = ['Leads', 'Interesados', 'Visitas', 'Ventas'];
    const shades = [['#FF005E', '#FF4D8D'], ['#D6004F', '#FF2E75'], ['#AE0041', '#E0005A'], ['#8C0034', '#C2004A']];
    const funnel = fv.map((v, i) => ({
      w: (!isNaN(v) && L > 0 ? Math.max(18, Math.min(100, v / L * 100)) : 18).toFixed(1),
      n: isNaN(v) ? '—' : Math.round(v).toLocaleString('es-EC'),
      label: fl[i], c1: shades[i][0], c2: shades[i][1]
    }));

    // Resultado
    const ref = sec ? sec.ref : [0, 0, 0];
    const you = valid ? [I / L * 100, V / I * 100, S / V * 100] : [0, 0, 0];
    const t = st.t ?? 1;
    const ease = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);

    const stages = names.map((name, i) => {
      const rel = ref[i] ? (you[i] - ref[i]) / ref[i] : 0;
      if (rel < worstRel) { worstRel = rel; worst = i; }
      const p = ease((t - 0.25 - i * 0.12) / 0.5);
      const max = Math.max(you[i], ref[i], 1) * 1.1;
      const up = rel >= 0.1, down = rel <= -0.1;
      return {
        name, ref: this.pct(ref[i]),
        youShown: this.pct(you[i] * p), youW: (you[i] / max * 100 * p).toFixed(1), refW: (ref[i] / max * 100 * Math.min(1, p * 1.4)).toFixed(1),

        delay: (0.2 + i * 0.12).toFixed(2), rel

    });

      const cols = ['#FF005E', '#FF4D8D', '#C8C3B4', '#8C0034', '#FFFFFF'];
      for (let i = 0; i < 26; i++) {
        const a = (i / 26) * Math.PI * 2 + (i % 3) * 0.2;
        const dist = 120 + (i * 37) % 140;
        const delay = (i % 6) * 0.015, dur = 0.55 + (i % 5) * 0.06;
        const tp = Math.max(0, Math.min(1, (t - delay) / dur));
        const e = 1 - Math.pow(1 - tp, 3);
        const o = tp <= 0 ? 0 : tp < 0.12 ? tp / 0.12 : Math.max(0, 1 - (tp - 0.12) / 0.88);
        const sz = 4 + (i % 4) * 2;
        parts.push({ x: Math.round(Math.cos(a) * dist * e - sz / 2), y: Math.round(Math.sin(a) * dist * 0.7 * e - sz / 2 + 40 * tp * tp), rot: Math.round(tp * 220 * (i % 2 ? 1 : -1)), o: o.toFixed(2), s: sz, r: i % 2 ? '50%' : '2px', c: cols[i % cols.length] });
      }
    }

    return {
      steps, sectors: sectorsV, fields, funnel,
      isStep1: step === 1, isStep2: step === 2, isStep3: step === 3,
      invalid: !valid, invalidMsg,
      revealBg: valid ? '#FF005E' : '#3D0019',
      revealAnim: valid ? 'aiPulse 2.4s ease-in-out infinite' : 'none',
      reveal: () => { if (!valid || !sec) return; this.setState({ step: 3, revealed: true }); this.play(); },
      again: () => this.setState({ step: 2 }),
      particles: parts,
      heroLabel: hasOpp ? 'Podría cerrar cada mes' : 'Resultado de su embudo',
      heroValue: hasOpp ? '+' + shownExtra : '¡Bien!',
      heroSub: hasOpp ? 'ventas más con los mismos leads, mejorando la etapa ' + names[worst].toLowerCase() + '.' : 'Su embudo está en línea o por encima de su sector.',
      totalYouTxt: this.pct(totalYou), totalRefTxt: this.pct(totalRef),
      totalYouShown: this.pct(totalYou * pt),
      ringYou: (490.09 * (1 - Math.min(1, totalYou / ringMax) * pt)).toFixed(2),
      ringRef: (376.99 * (1 - Math.min(1, totalRef / ringMax) * pt)).toFixed(2),
      stages, hasOpp, oppTip: hasOpp ? tips[worst] : ''
    };
  }
}
</script>
